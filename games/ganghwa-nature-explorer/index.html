<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}</style></head><body>
<title>강화중 자연 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-height field-notebook game — HUD strip, map stage, dock; sheets slide over the map. Single light look on purpose. */
:root{
  --paper:#eef1e4; --card:#fbfcf6; --ink:#1d3327; --ink2:#53695a; --line:#cbd4bf;
  --leaf:#3f7a4a; --leaf-2:#dcebd2; --gold:#d99a12; --gold-2:#fff2c9; --pond:#2c7486; --danger:#b4462f;
  --display:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;color:var(--leaf);margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand img{height:34px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.9rem}
.chip b{font-family:var(--display);font-weight:400;font-size:1rem}
.chip.chain.hot{background:var(--gold-2);border-color:var(--gold)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#4d7a3f}
#map{display:block;width:100%;height:100%;touch-action:none}
#prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--gold-2);font-family:var(--display);font-size:1.05rem;box-shadow:0 3px 0 var(--ink)}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:8px}
.fab button{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:.78rem;line-height:1.1;box-shadow:0 3px 0 var(--ink)}
.fab button[aria-pressed="true"]{background:var(--gold-2)}
.keys{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:.78rem;color:#fff;background:rgba(20,40,28,.55);padding:6px 10px;border-radius:8px;line-height:1.5}
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,420px)}
.toast{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:7px 14px;font-size:.92rem;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.gold{background:var(--gold-2);border-color:var(--gold)}
.toast.bad{border-color:var(--danger)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-top:2px solid var(--line)}
.dock button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.82rem;position:relative}
.dock button:hover{background:var(--leaf-2)}
.dock .ico{font-family:var(--emoji);font-size:1.3rem}
.dot{position:absolute;top:4px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--danger)}

.overlay{position:fixed;inset:0;background:rgba(18,32,24,.45);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);width:min(100%,720px);max-height:100%;display:flex;flex-direction:column;min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px dashed var(--line)}
.card>header h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;margin-right:auto;text-wrap:balance}
.x{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:4px 12px}
.body{padding:16px 18px;overflow:auto;min-width:0}
.btn{border:2px solid var(--ink);background:var(--leaf);color:#fff;border-radius:10px;padding:8px 16px;font-family:var(--display);font-size:1.05rem;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink2)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{height:10px;border-radius:99px;background:var(--leaf-2);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--leaf)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.cell:hover{border-color:var(--ink)}
.cell .ic{font-family:var(--emoji);font-size:2rem;height:46px;display:flex;align-items:center}
.cell .ic img{width:44px;height:44px;object-fit:contain}
.cell .nm{font-size:.82rem;line-height:1.2;word-break:keep-all}
.cell .ct{font-size:.72rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.unk .nm{color:var(--ink2)}
.vb{display:flex;gap:3px;min-height:10px}
.vb i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.vb .giant{background:#7aa35a}.vb .special{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;border:1px solid currentColor;letter-spacing:.03em}
.detail{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.detail .big{font-family:var(--emoji);font-size:80px;text-align:center;line-height:1}
.detail .big{font-size:130px}.detail .big img{width:190px;height:190px;object-fit:contain}
.detail h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:10px 0}
.kv dt{color:var(--ink2)}.kv dd{margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);flex-wrap:wrap}
.row .grow{flex:1;min-width:160px}
.row .ttl{font-family:var(--display);font-size:1.08rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink2)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.form textarea{min-height:80px;resize:vertical}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{font-family:var(--emoji);font-size:1.3rem;width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff}
.emojis button[aria-pressed="true"]{border-color:var(--ink);background:var(--gold-2)}
.checks{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink)}
.checks label{flex-direction:row;align-items:center;gap:4px;color:var(--ink)}
.status{font-size:.78rem;padding:2px 8px;border-radius:999px;border:1px solid}
.status.pending{color:#8a6a10;background:var(--gold-2)}
.status.approved{color:var(--leaf);background:var(--leaf-2)}
.status.rejected{color:var(--danger);background:#f8e3de}
h4{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:18px 0 8px}
.rank .row{font-variant-numeric:tabular-nums}
.rank .n{font-family:var(--display);font-size:1.3rem;width:28px;text-align:center}
.rank .me{border-color:var(--gold);background:var(--gold-2)}
.enc .card{width:min(100%,440px);align-items:stretch}
.enc .body{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#encCanvas{width:min(100%,340px);aspect-ratio:1/1;max-width:100%;border-radius:14px;background:var(--paper);border:2px solid var(--line);touch-action:none}
#encCanvas.wide{aspect-ratio:34/23}
.enc-name{font-family:var(--display);font-size:1.5rem}
.vtag{display:inline-block;padding:2px 10px;border-radius:999px;font-family:var(--display);font-size:.95rem}
.vtag.gold{background:var(--gold);color:var(--ink)}
.vtag.white{background:#fff;border:1px solid var(--ink)}
.vtag.giant{background:#7aa35a;color:#fff}
.vtag.special{color:var(--ink);border:1px solid var(--ink)}
.spline{width:100%;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--gold-2);border:1px dashed var(--gold)}
.spline .ic{font-family:var(--emoji);font-size:1.6rem;width:40px;text-align:center}
.spline .ic img{width:36px;height:36px;object-fit:contain}
.prot{color:var(--danger)}
.dexbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:-4px 0 12px;font-size:.9rem}
.dexbar label{display:inline-flex;gap:6px;align-items:center}
.dexbar select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:8px;padding:3px 6px}
.linkbtn{border:0;background:none;padding:0;color:var(--leaf);text-decoration:underline;font:inherit;cursor:pointer}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:8px}
.savecard{width:min(100%,420px);border:2px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.savecard.warn{border-color:var(--danger);background:#fbeeea}
.savecard .ttl{font-family:var(--display);font-size:1.1rem}
.savegrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.92rem;font-variant-numeric:tabular-nums}
.savegrid b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.titlebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.pips i.on{background:var(--leaf)}
.pips i.x{background:var(--danger)}
.result .big{font-family:var(--emoji);font-size:96px;line-height:1.1}
.result .big img{width:120px;height:120px;object-fit:contain}
.result.glow .big{filter:drop-shadow(0 0 18px rgba(240,180,20,.9))}
.new{font-family:var(--display);color:#fff;background:var(--danger);padding:2px 10px;border-radius:999px}
.sizebox{font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.sizebox b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.pts{font-family:var(--display);font-size:1.4rem;color:var(--leaf);font-variant-numeric:tabular-nums}
.fact{background:var(--paper);border-radius:12px;padding:10px 14px;text-align:left;line-height:1.6;max-width:60ch}
@media (max-width:560px){
  .brand{font-size:1.1rem}
  .chip{font-size:.8rem;padding:3px 8px}
  .keys{display:none}
  .form{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand" id="brand">강화중 자연 탐험대</div>
    <span class="chip" id="cClock">아침 07:00</span>
    <span class="chip" id="cWeather">맑음</span>
    <span class="chip" title="탐험 점수"><b id="cPts">0</b>점</span>
    <span class="chip chain" id="cChain" title="연속 관찰 체인: 실패하거나 뛰어서 생물을 놀라게 하면 끊겨요">체인 <b id="cChainN">0</b></span>
  </header>
  <main class="stage">
    <canvas id="map" aria-label="학교 주변 지도"></canvas>
    <div id="toasts" aria-live="polite"></div>
    <button id="prompt" hidden>🔍 풀숲 살펴보기 <span class="muted">[E]</span></button>
    <div class="keys">이동 WASD·방향키 / 화면 탭<br>Shift 달리기(생물이 놀라요) · E·Space 관찰</div>
    <div class="fab"><button id="bRun" aria-pressed="false">달리기</button></div>
  </main>
  <nav class="dock">
    <button data-open="dex"><span class="ico">📒</span>도감</button>
    <button data-open="missions"><span class="ico">🎯</span>미션<span class="dot" id="mDot" hidden></span></button>
    <button data-open="shop"><span class="ico">🎒</span>장비</button>
    <button data-open="report"><span class="ico">📮</span>제보<span class="dot" id="rDot" hidden></span></button>
    <button data-open="rank"><span class="ico">🏆</span>랭킹</button>
  </nav>
</div>

<div class="overlay" id="sheet" hidden>
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="x" id="sheetClose">닫기</button></header>
    <div class="body" id="sheetBody"></div>
  </section>
</div>
<div class="overlay enc" id="enc" hidden>
  <section class="card" role="dialog" aria-modal="true"><div class="body" id="encBody"></div></section>
</div>

<script>
"use strict";
/* ================= 데이터 ================= */
const T=32, W=60, H=36;
const ZONES={forest:'뒷산 숲길',pond:'연못가',flower:'화단',field:'운동장',meadow:'풀밭',path:'보도·담장',kitchen:'급식실 뒤',paddy:'논·개천',tidal:'갯벌 탐사'};
const PERIODS={M:'아침',D:'낮',E:'저녁',N:'밤'};
const CATS=['곤충','기타 무척추','어류','양서·파충','새','포유류','식물'];
const TIERS=[null,{name:'흔함',w:50,pts:10,col:'#5e7464'},{name:'보통',w:22,pts:25,col:'#3f7a4a'},{name:'희귀',w:7,pts:60,col:'#2c7486'},{name:'전설',w:2,pts:150,col:'#8a4fb0'}];
const VARIANTS={giant:{name:'거대',mult:2,p:.04},special:{name:'특별',mult:10,p:.012}};
const FX={GOLD:'sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.12)',WHITE:'grayscale(1) brightness(1.7) contrast(.85)',PINK:'sepia(1) saturate(4) hue-rotate(285deg) brightness(1.15)',BLUE:'sepia(1) saturate(4) hue-rotate(170deg)',DARK:'brightness(.35) contrast(1.4)',ORANGE:'sepia(1) saturate(5) hue-rotate(-25deg)',RAINBOW:'saturate(3) hue-rotate(120deg) brightness(1.1)',SILVER:'grayscale(1) brightness(1.3) contrast(1.3)',PURPLE:'sepia(1) saturate(4) hue-rotate(230deg)',YELLOW:'sepia(1) saturate(5) hue-rotate(5deg) brightness(1.15)'};
const SEASONS=[{n:'봄',c:'봄',ico:'🌸'},{n:'여름',c:'여',ico:'🌿'},{n:'가을',c:'가',ico:'🍂'},{n:'겨울',c:'겨',ico:'❄️'}];
const SVG={
  dragon:c=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g fill='rgba(215,236,250,.85)' stroke='#7896a6' stroke-width='1'><ellipse cx='19' cy='21' rx='16' ry='5' transform='rotate(-14 19 21)'/><ellipse cx='45' cy='21' rx='16' ry='5' transform='rotate(14 45 21)'/><ellipse cx='20' cy='30' rx='14' ry='4.5' transform='rotate(10 20 30)'/><ellipse cx='44' cy='30' rx='14' ry='4.5' transform='rotate(-10 44 30)'/></g><circle cx='32' cy='14' r='5.5' fill='${c}'/><rect x='29' y='17' width='6' height='15' rx='3' fill='${c}'/><rect x='30.3' y='30' width='3.4' height='30' rx='1.7' fill='${c}'/></svg>`,
  strider:()=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g stroke='#3a3a33' stroke-width='2' fill='none' stroke-linecap='round'><path d='M30 26 L14 12 L6 10'/><path d='M34 26 L50 12 L58 10'/><path d='M30 32 L10 36 L2 46'/><path d='M34 32 L54 36 L62 46'/><path d='M31 38 L18 52 L12 62'/><path d='M33 38 L46 52 L52 62'/></g><ellipse cx='32' cy='32' rx='4' ry='14' fill='#3a3a33'/><circle cx='32' cy='17' r='3' fill='#3a3a33'/></svg>`,
  cicada:()=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g fill='rgba(225,235,225,.8)' stroke='#6a5a3a' stroke-width='1.2'><path d='M30 20 C14 24 10 44 22 56 C26 48 28 34 30 22Z'/><path d='M34 20 C50 24 54 44 42 56 C38 48 36 34 34 22Z'/></g><ellipse cx='32' cy='30' rx='8' ry='14' fill='#4d3a22'/><ellipse cx='32' cy='16' rx='10' ry='5' fill='#3a2c18'/><circle cx='23' cy='15' r='2.6' fill='#9c8' /><circle cx='41' cy='15' r='2.6' fill='#9c8'/></svg>`,
  firefly:()=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g'><stop offset='0' stop-color='#fbff9a'/><stop offset='.5' stop-color='rgba(220,255,90,.6)'/><stop offset='1' stop-color='rgba(220,255,90,0)'/></radialGradient></defs><circle cx='32' cy='46' r='17' fill='url(#g)'/><ellipse cx='32' cy='30' rx='8' ry='14' fill='#2b2b2b'/><path d='M24 22 L32 44 L40 22Z' fill='#3d3d3d'/><ellipse cx='32' cy='18' rx='6' ry='5' fill='#e66a3c'/><ellipse cx='32' cy='44' rx='6' ry='5' fill='#f7f37a'/></svg>`,
  isopod:(rolled)=>rolled
    ?`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='34' r='18' fill='#5b5f66'/><g stroke='#3c4046' stroke-width='2.2' fill='none'><path d='M16 28 Q32 20 48 28'/><path d='M14 35 Q32 27 50 35'/><path d='M16 42 Q32 34 48 42'/></g><circle cx='26' cy='22' r='3' fill='#8d939b'/></svg>`
    :`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g stroke='#4a4d52' stroke-width='2' stroke-linecap='round'><path d='M26 12 L20 4'/><path d='M38 12 L44 4'/></g><ellipse cx='32' cy='34' rx='14' ry='22' fill='#6d6a63'/><g stroke='#4f4c46' stroke-width='2' fill='none'><path d='M19 24 H45'/><path d='M18 30 H46'/><path d='M18 36 H46'/><path d='M19 42 H45'/><path d='M21 48 H43'/></g><circle cx='32' cy='14' r='6' fill='#5a5750'/></svg>`
};
const svgURI=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);

const tile=new Uint8Array(W*H), zone=new Array(W*H).fill('path');
function setT(x,y,t,z){if(x<0||y<0||x>=W||y>=H)return;tile[y*W+x]=t;if(z)zone[y*W+x]=z;}
function rect(x0,y0,x1,y1,t,z){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setT(x,y,t,z);}
(function gen(){

  // 논·개천 (동락천 모티프): 논두렁으로 나뉜 논과 구불구불한 개천, 다리 두 개
  rect(48,0,59,19,TL.PADDY,'paddy');

const HIDE=new Set(['bush','hedge','grass','fern','reed','flowers','weed','rock','bin','box','rice','salt','mound']);
const OBJS=[], OGRID=new Map();
(function genObjs(){
  const R=mulberry32(21);
  const add=(type,x,y,o={})=>{const z=zone[clamp(Math.floor(y/T),0,H-1)*W+clamp(Math.floor(x/T),0,W-1)];
    const ob=Object.assign({type,x,y,v:Math.floor(R()*OBJ_VARS[type]),zone:z,sw:0,sv:0,ph:R()*6.28,spot:null,r:OBJ_DEF[type].r,flex:OBJ_DEF[type].flex},o);
    OBJS.push(ob);if(ob.r){const k=Math.floor(x/T)+','+Math.floor(y/T);(OGRID.get(k)||OGRID.set(k,[]).get(k)).push(ob);}return ob;};
  const near=(x,y,r)=>OBJS.some(o=>Math.abs(o.x-x)<r&&Math.abs(o.y-y)<r*.7);
  const startX=24,startY=14;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=tile[y*W+x],cx=x*T+T/2,cy=y*T+T/2,j=()=>(R()-.5)*T*.8;
    if(Math.abs(x-startX)<2&&Math.abs(y-startY)<2)continue;

    if(t===TL.TREE){add('tree',cx+j()*.3,cy+12);continue}
    if(t===TL.FOREST){if(r<.2)add('fern',cx+j(),cy+j());else if(r<.3)add('bush',cx+j()*.5,cy+j()*.5);else if(r<.45)add('grass',cx+j(),cy+j());else if(r<.5)add('rock',cx+j(),cy+j());}
    else if(t===TL.TALL){const n=r<.35?2:r<.72?1:0;for(let i=0;i<n;i++){const px=cx+j(),py=cy+j();if(!near(px,py,14))add('grass',px,py)}
      const r2=R();if(r2<.05)add('bush',cx+j()*.4,cy+j()*.4);else if(r2<.09)add('flowers',cx+j(),cy+j());else if(r2<.11)add('weed',cx+j(),cy+j());}
    else if(t===TL.GRASS){if(r<.3)add('grass',cx+j(),cy+j());else if(r<.4)add('flowers',cx+j(),cy+j());else if(r<.45)add('bush',cx+j()*.4,cy+j()*.4);else if(r<.48)add('rock',cx+j(),cy+j());else if(r<.56)add('weed',cx+j(),cy+j());}
    else if(t===TL.BANK){if(r<.5)add('reed',cx+j(),cy+j());else if(r<.65)add('grass',cx+j(),cy+j());else if(r<.69)add('rock',cx+j(),cy+j());}
    else if(t===TL.FLOWER){if(r<.6)add('flowers',cx+j()*.6,cy+j()*.4);else if(r<.72)add('grass',cx+j(),cy+j()*.4);}
    else if(t===TL.SAND){const border=x===14||x===34||y===16||y===31;if(border&&r<.5)add(R()<.6?'grass':'weed',cx+j(),cy+j());}
    else if(t===TL.PADDY){for(const [ox,oy] of [[-8,-4],[8,-4],[-8,12],[8,12]])if(R()<.6)add('rice',cx+ox+(R()-.5)*3,cy+oy);}
    else if(t===TL.MUD){if(r<.12)add('salt',cx+j(),cy+j());else if(r<.32)add('mound',cx+j(),cy+j());else if(r<.35)add('rock',cx+j(),cy+j());}
    else if(t===TL.PATH&&zone[y*W+x]==='paddy'){if(r<.16)add(R()<.6?'grass':'weed',cx+j(),cy+j());else if(r<.24)add('reed',cx+j(),cy+j());}
    else if(t===TL.PATH&&zone[y*W+x]==='path'){if(r<.06)add('weed',cx+j(),cy+j());else if(r<.075)add('rock',cx+j(),cy+j());}
    else if(t===TL.CONC){if(r<.1)add('weed',cx+j(),cy+j());}
  }
  // 본관 앞 생울타리(회양목)
  for(let x=19;x<=29;x++)if(x!==24)add('hedge',x*T+T/2,8*T+T-4);
  // 운동장 둘레 가로수
  for(const y of [15,19,23,27,31])add('tree',35*T+T/2,y*T+T-2,{r:14});
  for(const x of [15,19,31])add('tree',x*T+T/2,32*T+T-2,{r:14});
  for(const x of [3,9])add('tree',x*T+T/2,20*T+T-2,{r:14});

  for(const [bx,by] of [[41,2],[42,1],[46,6]])add('box',bx*T+T/2,by*T+T-2);
  for(const o of OBJS)if(o.type==='tree'&&o.r){const k=Math.floor(o.x/T)+','+Math.floor(o.y/T);(OGRID.get(k)||OGRID.set(k,[]).get(k)).push(o);}
})();
const HOSTS={},TREEHOSTS={};
for(const o of OBJS){if(HIDE.has(o.type))(HOSTS[o.zone]=HOSTS[o.zone]||[]).push(o);else if(o.type==='tree')(TREEHOSTS[o.zone]=TREEHOSTS[o.zone]||[]).push(o);}

const SPR={};
function buildSprites(){

const mapCanvas=document.createElement('canvas');mapCanvas.width=W*T;mapCanvas.height=H*T;
const TEX_OF={0:'path',1:'grass',2:'tall',3:'sand',4:'flower',5:'water',6:'forest',7:'forest',8:'path',9:'bank',10:'conc',11:'paddy',12:'mud',13:'sea',14:'water'};
const POND={cx:6.7*T,cy:28.5*T,rx:3.4*1.3*T,ry:3.4*T};
function vnoise(seed){const r=mulberry32(seed),G=12,gw=Math.ceil(W*T/(T*G/4))+2,gh=Math.ceil(H*T/(T*G/4))+2,v=[];for(let i=0;i<gw*gh;i++)v.push(r());const cell=T*3;
  return(x,y)=>{const gx=x/cell,gy=y/cell,ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy,s=t=>t*t*(3-2*t),a=v[iy*gw+ix]||0,b=v[iy*gw+ix+1]||0,c=v[(iy+1)*gw+ix]||0,d=v[(iy+1)*gw+ix+1]||0;
    return a+(b-a)*s(fx)+(c-a)*s(fy)+(a-b-c+d)*s(fx)*s(fy);};}
function paintBase(){
  const g=mapCanvas.getContext('2d'),r=mulberry32(3),n1=vnoise(9);
  const COL={0:'#d3ccb8',1:'#8fbf68',2:'#74a854',3:'#e3cf9c',4:'#7fb35b',5:'#a8bf78',6:'#628f4c',7:'#628f4c',8:'#d3ccb8',9:'#a8bf78',10:'#bdbcb1',11:'#8fb27a',12:'#8d8270',13:'#4f8fa8',14:'#4f97ad'};
  const pats={};for(const k of TEX_KEYS){const a=ART['tex_'+k];if(a){const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(a,0,0,128,128);pats[k]=g.createPattern(c,'repeat');}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=tile[y*W+x],px=x*T,py=y*T,pk=t===TL.WATER?pats.bank:pats[TEX_OF[t]];
    g.fillStyle=pk||COL[t];g.fillRect(px,py,T,T);
    if(pk)continue;
    if(t===TL.PATH||t===TL.BUILD){const off=(y%2)*8;for(let by=0;by<2;by++)for(let bx=-1;bx<2;bx++){const xx=px+bx*16+((by+y)%2?8:0),yy=py+by*16;g.fillStyle=`rgba(${120+r()*40|0},${100+r()*30|0},${80},.12)`;g.fillRect(xx+1,yy+1,14,14);g.strokeStyle='rgba(110,95,70,.28)';g.lineWidth=1;g.strokeRect(xx+.5,yy+.5,15,15);}}
    if(t===TL.CONC){g.strokeStyle='rgba(0,0,0,.08)';g.strokeRect(px+.5,py+.5,T-1,T-1);if(r()<.2){g.strokeStyle='rgba(0,0,0,.15)';g.beginPath();g.moveTo(px+r()*T,py);g.lineTo(px+r()*T,py+T);g.stroke();}}
    if([1,2,6,7,9].includes(t)){for(let i=0;i<14;i++){g.strokeStyle=r()<.5?'rgba(30,70,25,.28)':'rgba(190,230,140,.28)';g.lineWidth=1.2;const bx=px+r()*T,by=py+r()*T;g.beginPath();g.moveTo(bx,by);g.lineTo(bx+(r()-.5)*3,by-3-r()*4);g.stroke();}}
    if(t===TL.FOREST||t===TL.TREE){for(let i=0;i<3;i++){g.fillStyle=pick(['#8a6a3a','#a07a3e','#6f5a2e']);g.globalAlpha=.55;g.beginPath();g.ellipse(px+r()*T,py+r()*T,2.4,1.3,r()*3,0,7);g.fill();}g.globalAlpha=1;}
    if(t===TL.FLOWER){g.fillStyle='rgba(110,80,50,.25)';g.fillRect(px,py,T,T);}
    if(t===TL.SAND){for(let i=0;i<6;i++){g.fillStyle=r()<.5?'rgba(140,110,60,.2)':'rgba(255,255,255,.3)';g.fillRect(px+r()*T,py+r()*T,2,2);}}
    if(t===TL.PADDY){g.fillStyle='rgba(120,100,60,.25)';g.fillRect(px,py,T,T);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1.2;for(let i=0;i<2;i++){const yy=py+6+r()*20;g.beginPath();g.moveTo(px+3,yy);g.lineTo(px+T-3,yy+(r()-.5)*3);g.stroke();}}
    if(t===TL.MUD){g.fillStyle='rgba(255,255,255,.1)';for(let i=0;i<3;i++){g.beginPath();g.ellipse(px+r()*T,py+r()*T,6+r()*6,1.5,0,0,7);g.fill();}g.fillStyle='rgba(40,30,20,.45)';for(let i=0;i<3;i++){g.beginPath();g.arc(px+r()*T,py+r()*T,1.3,0,7);g.fill();}}
    if(t===TL.SEA||t===TL.STREAM){g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=1.5;g.beginPath();const wy=py+8+r()*16;g.moveTo(px+4,wy);g.quadraticCurveTo(px+T/2,wy-3,px+T-4,wy);g.stroke();}
    if(t===TL.BANK){for(let i=0;i<2;i++){g.fillStyle='rgba(120,110,90,.45)';g.beginPath();g.ellipse(px+r()*T,py+r()*T,3,2,0,0,7);g.fill();}}
  }
  // 물: 둥근 연못과 깊이감
  {const ex=POND.rx+T*.55,ey=POND.ry+T*.5;g.save();g.beginPath();g.ellipse(POND.cx,POND.cy,ex,ey,0,0,7);g.clip();
    if(pats.water)g.fillStyle=pats.water;else{const gr=g.createRadialGradient(POND.cx,POND.cy,8,POND.cx,POND.cy,ex);gr.addColorStop(0,'#2a6e88');gr.addColorStop(.75,'#4c9bb0');gr.addColorStop(1,'#7cbcc4');g.fillStyle=gr;}
    g.fillRect(POND.cx-ex,POND.cy-ey,ex*2,ey*2);g.restore();
    g.strokeStyle='rgba(120,100,70,.55)';g.lineWidth=4;g.beginPath();g.ellipse(POND.cx,POND.cy,ex,ey,0,0,7);g.stroke();}
  // 얼룩덜룩한 자연스러움
  for(let y=0;y<H*T;y+=8)for(let x=0;x<W*T;x+=8){const tt=tile[Math.floor(y/T)*W+Math.floor(x/T)];if(tt===TL.WATER||tt===TL.BUILD||tt===TL.SEA||tt===TL.STREAM)continue;const n=n1(x,y)-.5;g.fillStyle=n>0?`rgba(255,250,200,${n*.22})`:`rgba(10,40,10,${-n*.22})`;g.fillRect(x,y,8,8);}
  // 풀 가장자리가 길·모래 위로 넘어오게
  const green=new Set([1,2,4,6,7,9]),bare=new Set([0,3,10]);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!green.has(tile[y*W+x]))continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H||!bare.has(tile[ny*W+nx]))continue;
      for(let i=0;i<7;i++){const ex=dx?(dx>0?(x+1)*T:x*T):x*T+r()*T,ey=dy?(dy>0?(y+1)*T:y*T):y*T+r()*T;const len=4+r()*6;
        g.strokeStyle=r()<.5?'#5d9a43':'#7cb556';g.lineWidth=1.6;g.beginPath();g.moveTo(ex-dx*3,ey-dy*3+2);g.lineTo(ex+dx*len*.6+(r()-.5)*3,ey+dy*len*.6-len*.5);g.stroke();}}}
  // 운동장 트랙
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;
  g.beginPath();g.roundRect(15.5*T,17*T,18*T,14*T,7*T);g.stroke();
  g.beginPath();g.moveTo(24.5*T,17*T);g.lineTo(24.5*T,31*T);g.stroke();
  g.beginPath();g.arc(24.5*T,24*T,2*T,0,7);g.stroke();
  for(const gx of [16.2,32.8]){g.strokeStyle='#f4f4f4';g.lineWidth=3;g.strokeRect(gx*T-6,22.6*T,12,2.8*T);}
  // 연잎
  const lr=mulberry32(4);for(let i=0;i<9;i++){const a=lr()*6.28,d=lr()*.75,x=POND.cx+Math.cos(a)*d*POND.rx,y=POND.cy+Math.sin(a)*d*POND.ry,s=5+lr()*4;g.fillStyle='#3f8a46';g.beginPath();g.arc(x,y,s,.35,6.0);g.lineTo(x,y);g.fill();g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.beginPath();g.arc(x,y,s*.6,.6,2);g.stroke();if(lr()<.3)blob(g,x+2,y-2,2.2,'#f6c1d4');}
  // 학교 건물 (행복관-본관-입지관, 운동장 쪽으로 열린 모양)
  g.fillStyle='rgba(0,0,0,.22)';for(const k of WINGS){g.beginPath();g.roundRect(k.x*T+8,k.y*T+10,k.w*T,k.h*T,6);g.fill();}
  const schoolImg=ARTT.bld_school||ART.bld_school;
  if(schoolImg)g.drawImage(schoolImg,SCHOOL.x*T,SCHOOL.y*T,SCHOOL.w*T,SCHOOL.h*T);
  else{
    for(const k of WINGS){const x=k.x*T,y=k.y*T,w=k.w*T,h=k.h*T,vert=k.h>k.w;
      const rg=vert?g.createLinearGradient(x,0,x+w,0):g.createLinearGradient(0,y,0,y+h);rg.addColorStop(0,'#b4664c');rg.addColorStop(.5,'#9a553f');rg.addColorStop(1,'#83452f');g.fillStyle=rg;g.fillRect(x,y,w,h);
      g.strokeStyle='rgba(0,0,0,.13)';g.lineWidth=1;
      if(vert)for(let lx=x+6;lx<x+w;lx+=7){g.beginPath();g.moveTo(lx,y+5*T);g.lineTo(lx,y+h);g.stroke();}
      else for(let ly=y+6;ly<y+h;ly+=7){g.beginPath();g.moveTo(x,ly);g.lineTo(x+w,ly);g.stroke();}
      g.strokeStyle='rgba(255,230,200,.35)';g.lineWidth=2;g.beginPath();if(vert){g.moveTo(x+w/2,y+4.5*T);g.lineTo(x+w/2,y+h-T*1.8);}else{g.moveTo(x+T,y+T*1.5);g.lineTo(x+w-T,y+T*1.5);}g.stroke();}
    const facade=(x0,x1,y1,hgt,door)=>{const x=x0*T,w=(x1-x0)*T,y=y1*T-hgt;g.fillStyle='#ebe3d1';g.fillRect(x,y,w,hgt);g.fillStyle='#d6ccb5';g.fillRect(x,y,w,4);g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x,y+hgt-3,w,3);
      const rowH=(hgt-14)/3;for(let r=0;r<3;r++)for(let wx=x+8;wx<x+w-16;wx+=26){const wy=y+8+r*rowH;g.fillStyle='#9fc6d6';g.fillRect(wx,wy,16,rowH-5);g.fillStyle='rgba(255,255,255,.45)';g.fillRect(wx+2,wy+1,4,3);}
      if(door!=null){g.fillStyle='#5e4836';g.fillRect(door*T-14,y1*T-22,28,22);g.fillStyle='#86c3d4';g.fillRect(door*T-11,y1*T-19,9,16);g.fillRect(door*T+2,y1*T-19,9,16);}};
    facade(19,30,8,2*T,24.5);facade(14,19,14,1.7*T,16.5);facade(30,35,14,1.7*T,32.5);
  }
  g.font='18px "Do Hyeon",sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(const [nm,lx,ly] of [['본관',24.5,3.4],['행복관',16.5,9],['입지관',32.5,9]]){const tw=g.measureText(nm).width+20;g.fillStyle='#2c4a3a';g.beginPath();g.roundRect(lx*T-tw/2,ly*T-13,tw,26,6);g.fill();g.fillStyle='#fbfcf6';g.fillText(nm,lx*T,ly*T+1);}
  // 급식실
  for(const b of BUILDINGS){const x=b.x*T,y=b.y*T,w=b.w*T,h=b.h*T;
    g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.roundRect(x+8,y+10,w,h,6);g.fill();
    const bi=ARTT[b.key]||ART[b.key];if(bi){g.drawImage(bi,x,y,w,h);continue;}
    const rh=h*.42;const rg=g.createLinearGradient(0,y,0,y+rh);rg.addColorStop(0,'#b4664c');rg.addColorStop(1,'#8c4b37');g.fillStyle=rg;g.fillRect(x,y,w,rh);
    g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=1;for(let ly=y+6;ly<y+rh;ly+=7){g.beginPath();g.moveTo(x,ly);g.lineTo(x+w,ly);g.stroke();}
    g.fillStyle='#ebe3d1';g.fillRect(x,y+rh,w,h-rh);g.fillStyle='#d6ccb5';g.fillRect(x,y+rh,w,5);
    g.fillStyle='#9fc6d6';for(let wx=x+14;wx<x+w-22;wx+=30){g.fillRect(wx,y+rh+14,20,22);g.fillStyle='rgba(255,255,255,.5)';g.fillRect(wx+2,y+rh+16,6,8);g.fillStyle='#9fc6d6';}
    g.fillStyle='#6e5440';g.fillRect(x+w/2-14,y+h-30,28,30);g.fillStyle='#2c4a3a';g.beginPath();g.roundRect(x+w/2-46,y+rh*.3,92,26,6);g.fill();
    g.fillStyle='#fbfcf6';g.font='19px "Do Hyeon",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(b.name,x+w/2,y+rh*.3+14);}
}

const SAVE_KEY='sbr_save_v1';
function newState(){return{points:0,total:0,dex:{},up:{net:0,cam:0,shoe:0,luck:0},day:1,clock:0,weather:'sun',missions:[],bestChain:0,gold:0,awarded:[],intro:false,version:1}}
let S=newState();
try{const raw=localStorage.getItem(SAVE_KEY);if(raw)S=Object.assign(newState(),JSON.parse(raw));}catch(e){}
// 이전 버전 도감 기록을 무리 단위로 옮기기
const MIG={bang:'metu',seom:'metu',baechu:'nabi',horang:'nabi',gochu:'jamjari',mil:'jamjari',ggul:'beol',hobak:'beol',gong:'jwi',cheong:'gaeguri',chamgae:'gaeguri',dodo:'domabaem',sojjeok:'bueongi'};
function migrate(){
  for(const [o,n] of Object.entries(MIG)){const r=S.dex[o];if(!r)continue;const t=S.dex[n]||(S.dex[n]={n:0,v:{},first:r.first});t.n+=r.n||0;if(r.v&&r.v.giant)t.v.giant=(t.v.giant||0)+r.v.giant;delete S.dex[o];}
  for(const r of Object.values(S.dex)){r.v=r.v||{};if(r.v.clover){r.v.special=(r.v.special||0)+r.v.clover;}delete r.v.clover;delete r.v.gold;delete r.v.white;}
  delete S.dex.bandi;
}
migrate();
const season=()=>Math.floor((S.day-1)/3+2)%4;  // 3일마다 계절이 바뀜, 1일차는 가을
const seasonInfo=()=>SEASONS[season()];
let chain=0;
const player={x:24.5*T,y:14.5*T,face:1,dir:'down',moving:false,run:false,target:null,pending:null,stuck:0,vx:0,step:0};
let spots=[],particles=[],mode='map',spawnTimer=0,saveTimer=null,rainDrops=[],clouds=[],critters=[];
for(let i=0;i<110;i++)rainDrops.push({x:Math.random(),y:Math.random(),s:rnd(.7,1.2)});
for(let i=0;i<5;i++)clouds.push({x:rnd(0,W*T),y:rnd(0,H*T),r:rnd(160,260),vx:rnd(8,16)});
for(let i=0;i<5;i++)critters.push({x:rnd(15,33)*T,y:rnd(11.5,14)*T,t:Math.random()*10,c:pick(['#ffffff','#f6d24a','#f0a0c0'])});

function period(){const h=7+S.clock/60;return h<11?'M':h<16?'D':h<19?'E':'N';}
function clockText(){const m=Math.floor(S.clock),h=7+Math.floor(m/60);return `${PERIODS[period()]} ${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
const WEATHER_TXT={sun:'☀️ 맑음',cloud:'⛅ 흐림',rain:'🌧️ 비'};
const WEATHER=new Proxy(WEATHER_TXT,{get:(o,k)=>k==='rain'&&season()===3?'❄️ 눈':o[k]});
function rollWeather(){const r=Math.random();S.weather=r<.58?'sun':r<.82?'cloud':'rain';}
if(!S.missions.length){rollWeather();S.missions=makeMissions();}

/* ================= 미션 ================= */
function makeMissions(){
  const gens=[
    ()=>{const z=pick(['forest','pond','flower','field','meadow','kitchen','paddy','tidal']);return{t:'zone',z,goal:3,text:`${ZONES[z]}에서 생물 3번 관찰하기`}},
    ()=>{const c=pick(['곤충','새','식물','양서·파충','기타 무척추']);return{t:'cat',c,goal:2,text:`${c} 2번 기록하기`}},
    ()=>({t:'special',goal:1,text:'특별 개체 1마리 만나기'}),
    ()=>({t:'period',p:'N',goal:2,text:'밤(19시 이후)에 생물 2번 관찰하기'}),
    ()=>({t:'chain',goal:5,text:'연속 관찰 체인 5 달성하기'}),
    ()=>({t:'new',goal:1,text:'도감에 없던 새로운 종 발견하기'}),
    ()=>({t:'rare',goal:1,text:'희귀 이상 등급 생물 관찰하기'}),
    ()=>({t:'photo',goal:3,text:'사진 관찰 3번 성공하기'}),
  ];
  const idx=[...gens.keys()].sort(()=>Math.random()-.5).slice(0,3);
  return idx.map(i=>Object.assign(gens[i](),{prog:0,done:false,claimed:false,reward:120}));
}
function missionEvent(ev){
  let changed=false;
  for(const m of S.missions){if(m.done)continue;let inc=0;
    if(m.t==='zone'&&ev.zone===m.z)inc=1;
    if(m.t==='cat'&&ev.sp.cat===m.c)inc=1;
    if(m.t==='period'&&ev.period===m.p)inc=1;
    if(m.t==='new'&&ev.isNew)inc=1;
    if(m.t==='rare'&&ev.sp.tier>=3)inc=1;
    if(m.t==='photo'&&ev.sp.method==='photo')inc=1;
    if(m.t==='special'&&ev.v==='special')inc=1;
    if(m.t==='chain'){m.prog=Math.max(m.prog,chain);changed=true}
    if(inc){m.prog+=inc;changed=true}
    if(m.prog>=m.goal&&!m.done){m.done=true;toast(`🎯 미션 완료: ${m.text}`,'gold');}
  }
  if(changed)updateDots();
}

const UPG={
  net:{name:'넓은 포충망',desc:'채집 판정 구간이 넓어져요.',ico:'🥅'},
  cam:{name:'망원 카메라',desc:'사진 관찰 초점이 빨리 맞아요.',ico:'📷'},
  shoe:{name:'조용한 운동화',desc:'뛰어도 생물이 덜 놀라요.',ico:'👟'},
  luck:{name:'행운 돋보기',desc:'특별한 개체가 더 자주 나오고, 실루엣이 멀리서 보여요.',ico:'🔎'},
};
const UPG_COST=[150,400,900];
function eligible(z){const p=period(),w=S.weather,sc=seasonInfo().c;
  return ALL.filter(s=>s.zones.includes(z)&&s.periods.includes(p)&&(s.rain!=='only'||w==='rain')&&(!s.seasons||s.seasons.includes(sc)));}
function rollVariant(sp){
  const luck=1+.35*S.up.luck,cb=1+Math.min(chain,10)*.08,r=Math.random(),ps=VARIANTS.special.p*luck*cb;
  if(r<ps)return'special';
  if(r<ps+VARIANTS.giant.p*luck)return'giant';
  return null;
}
// 등장 균형: 구역을 먼저 고르면 종이 적은 구역(갯벌 등)의 흔한 종만 쏟아지므로,
// 플레이어 근처에서 나올 수 있는 '종'을 먼저 고른다. 최근에 자주 나온 종은 덜, 아직 못 만난 종은 조금 더 나온다.
const SPAWN_W=[0,10,8,5,2.5];   // 등급별 기본 비율(흔함·보통·희귀·전설)
const recent={};
function nearHosts(list){const out=[];if(!list)return out;for(const h of list){if(h.spot)continue;const d=Math.hypot(h.x-player.x,h.y-player.y)/T;if(d>3&&d<17)out.push(h);}return out;}
function spawnWeight(sp){
  let w=SPAWN_W[sp.tier]||4;
  if(sp.rain==='boost')w*=S.weather==='rain'?2:.7;
  w/=1+(recent[sp.id]||0)*2;                    // 방금 많이 나온 종은 쉬게
  if(!S.dex[sp.id]?.n)w*=1.6;                     // 아직 못 만난 종은 조금 더
  const on=spots.filter(t=>t.state==='idle'&&t.sp===sp).length;
  return on>=2?0:w*(on?.3:1);                     // 같은 종이 지도에 몰리지 않게
}
function spawn(){
  const opts=[];
  for(const z of Object.keys(ZONES)){if(!HOSTS[z]&&!TREEHOSTS[z])continue;const el=eligible(z);if(!el.length)continue;
    const nh=nearHosts(HOSTS[z]),nt=nearHosts(TREEHOSTS[z]);
    for(const sp of el){const hs=isTree(sp)?nt:nh;if(hs.length)opts.push({sp,z,hs});}}
  if(!opts.length)return;
  // 한 종이 여러 구역에 살아도 종 단위로 한 번만 뽑히도록 구역 수로 나눔
  const zc={};for(const o of opts)zc[o.sp.id]=(zc[o.sp.id]||0)+1;
  const o=weighted(opts,o=>spawnWeight(o.sp)/zc[o.sp.id]);if(!o)return;
  const sp=o.sp,z=o.z,host=pick(o.hs);
  for(const k in recent)recent[k]*=.93;recent[sp.id]=(recent[sp.id]||0)+1;
  const v=rollVariant(sp);
  const s={host,x:host.x,y:host.y-8,sp,v,z,size:rollSize(sp,v),age:0,life:rnd(60,95),state:'idle',ft:0,rt:rnd(.5,2),ph:Math.random()*6};

function endEncounter(ok,quiet,info){

  if(e.v==='special')S.gold++;
  const base=TIERS[e.sp.tier].pts,mult=e.v?VARIANTS[e.v].mult:1,cm=1+Math.min(chain-1,10)*.1;

  missionEvent({sp:e.sp,zone:spot.z,period:period(),isNew,v:e.v});

}

    if(!name||!desc){$('#rMsg').textContent='이름과 특징을 모두 적어 주세요.';return}
    if(!periods.length){$('#rMsg').textContent='본 시간대를 하나 이상 골라 주세요.';return}
    if(ALL.some(s=>s.name===name)){$('#rMsg').textContent='이미 도감에 있는 생물이에요. 다른 생물을 제보해 주세요.';return}
    const items=myItems().slice();if(items.length>=30){$('#rMsg').textContent='제보는 한 사람당 30개까지 보낼 수 있어요.';return}
    items.push({rid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,cat:$('#rCat').value,zones:[$('#rZone').value],periods,emoji:draft.emoji,desc,status:'pending',at:Date.now()});
    $('#rSend').disabled=true;$('#rMsg').textContent='보내는 중…';
    try{await writeReports(cloud.uid||'local',items);toast('📮 제보를 보냈어요. 선생님 확인을 기다려 주세요!');renderReport(b);}
    catch(e){$('#rSend').disabled=false;$('#rMsg').textContent=e?.code==='invalid_argument'?'이 페이지에서 제보를 보낼 권한이 없어요. 선생님께 "참여자(Contributor)" 권한을 요청하세요.':'보내지 못했어요. 잠시 뒤 다시 시도해 주세요.';}
  };
  if(isT)bindTeacher(b);
  if(cloud.db)fillReporterNames(b);
}
function teacherHTML(){
  const pend=[];for(const d of reportDocs)(d.items||[]).forEach(it=>{if(it.status==='pending')pend.push({d,it})});
  return `<h4>선생님 검토 (${pend.length})</h4><div class="list">${pend.length?pend.map(({d,it})=>`<div class="row"><span style="font-family:var(--emoji);font-size:1.6rem">${esc(it.emoji)}</span><div class="grow"><div class="ttl">${esc(it.name)} <span class="muted" style="font-size:.85rem">${esc(it.cat)} · ${esc(ZONES[it.zones?.[0]]||'')} · ${(it.periods||[]).map(p=>PERIODS[p]||'').join('·')}</span></div><div class="muted" style="font-size:.88rem">${esc(it.desc)}</div><div class="muted" style="font-size:.8rem">제보: <span data-who="${esc(d.owner)}">학생</span></div></div>
    <select data-tier="${esc(it.rid)}" aria-label="등장 등급">${[1,2,3,4].map(t=>`<option value="${t}" ${t===2?'selected':''}>${TIERS[t].name}</option>`).join('')}</select>
    <button class="btn" data-ok="${esc(d.owner)}|${esc(it.rid)}">승인</button><button class="btn alt" data-no="${esc(d.owner)}|${esc(it.rid)}">반려</button></div>`).join(''):'<div class="muted">검토할 제보가 없어요.</div>'}</div>`;
}
function bindTeacher(b){
  const act=async(key,status)=>{const [owner,rid]=key.split('|');const d=reportDocs.find(x=>x.owner===owner);if(!d)return;
    const items=d.items.map(it=>it.rid===rid?Object.assign({},it,{status,tier:+(b.querySelector(`[data-tier="${CSS.escape(rid)}"]`)?.value||2)}):it);
    try{await writeReports(owner,items);toast(status==='approved'?'✅ 승인했어요. 이제 게임에 등장해요.':'반려했어요.');}catch(e){toast('저장하지 못했어요. 편집 권한을 확인해 주세요.','bad')}};
  b.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>act(x.dataset.ok,'approved'));
  b.querySelectorAll('[data-no]').forEach(x=>x.onclick=()=>act(x.dataset.no,'rejected'));
}
async function nameOf(id){if(!cloud.user||id==='local')return '나';try{const p=await cloud.user.profiles([id]);return p[id]?.name||'탐험가'}catch(e){return '탐험가'}}
async function fillReporterNames(b){const els=[...b.querySelectorAll('[data-who]')];if(!els.length||!cloud.user)return;const ids=[...new Set(els.map(e=>e.dataset.who))];const ps=await cloud.user.profiles(ids);els.forEach(e=>{e.textContent=ps[e.dataset.who]?.name||'학생'});}

/* ================= 랭킹 ================= */
let rankTab='points';
function myRec(){const o={};for(const s of ALL){const r=S.dex[s.id];if(r?.max!=null)o[s.id]=r.max;}return o;}
async function renderRank(b){
  const found=ALL.filter(s=>S.dex[s.id]?.n).length,me=cloud.uid||'local';
  let rows=cloud.db?scores.slice():[{id:'local',total:S.total,species:found,gold:S.gold,rec:myRec()}];
  if(cloud.db&&!rows.some(r=>r.id===me))rows.push({id:me,total:S.total,species:found,gold:S.gold,rec:myRec()});
  const head=`<div class="tabs" role="tablist">${[['points','탐험 점수'],['size','큰 개체 기록'],['kings','최대 기록 보유']].map(([k,t])=>`<button role="tab" aria-selected="${k===rankTab}" data-r="${k}">${t}</button>`).join('')}</div>`;
  let html='';
  if(rankTab==='points'){
    rows.sort((a,b)=>(+b.total||0)-(+a.total||0));
    html=`<p class="muted" style="margin-top:0">누적 탐험 점수 순위예요. ${cloud.db?'같은 페이지를 연 친구들과 실시간으로 비교돼요.':'이 게임 사이트에서는 내 기록만 보여요. 친구와 화면을 보여 주며 비교해 보세요.'}</p>
    <div class="list rank">${rows.slice(0,30).map((r,i)=>`<div class="row ${r.id===me?'me':''}"><span class="n">${i+1}</span><div class="grow"><div class="ttl" data-n="${esc(r.id)}">${r.id===me?'나':'탐험가'}</div><div class="muted" style="font-size:.85rem">${rankTitle(+r.total||0)} · ${+r.species||0}종 · 특별 ${+r.gold||0}</div></div><b style="font-family:var(--display);font-size:1.2rem">${(+r.total||0).toLocaleString()}</b></div>`).join('')}</div>`;
  }else{
    // 종마다 가장 큰 기록을 가진 사람
    const best={};
    for(const r of rows){const rec=r.rec&&typeof r.rec==='object'?r.rec:{};for(const [id,x] of Object.entries(rec)){const sp=byId(id);if(!sp||!(+x>0))continue;if(!best[id]||+x>best[id].x)best[id]={x:+x,who:r.id};}}
    if(rankTab==='size'){
      const list=ALL.filter(s=>best[s.id]).sort((a,b)=>sizePct(b,best[b.id].x)-sizePct(a,best[a.id].x));
      html=`<p class="muted" style="margin-top:0">종마다 지금까지 가장 큰 개체예요. 서로 다른 종도 <b>같은 종 안에서 얼마나 큰지(상위 %)</b>로 줄을 세워 비교해요.${cloud.db?'':' 이 사이트에서는 내 기록만 보여요.'}</p>
      ${list.length?`<div class="list rank">${list.map((s,i)=>{const bst=best[s.id],my=S.dex[s.id]?.max,p=sizePct(s,bst.x);return `<div class="row ${bst.who===me?'me':''}"><span class="n">${i+1}</span><span class="cell" style="border:0;background:none;padding:0;width:44px"><span class="ic" style="height:40px">${iconHTML(s,null,36)}</span></span><div class="grow"><div class="ttl">${esc(s.name)} <b>${fmtSize(s,bst.x)}</b></div><div class="muted" style="font-size:.85rem">${sizeGrade(p)} · ${pctText(p)} · <span data-n="${esc(bst.who)}">${bst.who===me?'나':'탐험가'}</span>${my!=null&&bst.who!==me?` · 내 기록 ${fmtSize(s,my)}`:''}</div></div></div>`}).join('')}</div>`:'<div class="muted">아직 기록이 없어요. 생물을 관찰하면 크기가 기록돼요!</div>'}`;
    }else{
      const cnt={};for(const v of Object.values(best))cnt[v.who]=(cnt[v.who]||0)+1;
      const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
      html=`<p class="muted" style="margin-top:0">가장 큰 개체 기록을 몇 종이나 갖고 있는지 겨뤄요. 같은 종을 더 크게 찾으면 기록을 빼앗을 수 있어요!</p>
      ${list.length?`<div class="list rank">${list.map(([who,n],i)=>`<div class="row ${who===me?'me':''}"><span class="n">${i+1}</span><div class="grow"><div class="ttl" data-n="${esc(who)}">${who===me?'나':'탐험가'}</div></div><b style="font-family:var(--display);font-size:1.2rem">👑 ${n}종</b></div>`).join('')}</div>`:'<div class="muted">아직 기록이 없어요.</div>'}`;
    }
  }
  b.innerHTML=head+html;
  b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{rankTab=x.dataset.r;renderRank(b)});
  const ids=[...new Set([...b.querySelectorAll('[data-n]')].map(e=>e.dataset.n))];
  if(cloud.user&&ids.length){try{const ps=await cloud.user.profiles(ids);b.querySelectorAll('[data-n]').forEach(e=>{const p=ps[e.dataset.n];if(p)e.textContent=(p.isMe?'나 · ':'')+(p.name||'탐험가')});}catch(e){}}
}

/* ================= 저장 ================= */
let writeChain=Promise.resolve();
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,2500);}
function saveNow(){
  S.px=player.x;S.py=player.y;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}
  if(cloud.db&&cloud.uid){const snap=JSON.parse(JSON.stringify(S)),found=ALL.filter(s=>S.dex[s.id]?.n).length;
    writeChain=writeChain.then(()=>cloud.db.doc(`data/users/${cloud.uid}/save`).set(snap)).then(()=>cloud.db.doc('scores/'+cloud.uid).set({total:S.total,species:found,gold:S.gold,rec:myRec(),at:Date.now()})).catch(e=>console.warn('save',e));}
}
addEventListener('pagehide',saveNow);
function updateDots(){
  $('#mDot').hidden=!S.missions.some(m=>m.done&&!m.claimed);
  const isT=cloud.db?cloud.teacher:localTeacher;
  $('#rDot').hidden=!(isT&&reportDocs.some(d=>(d.items||[]).some(i=>i.status==='pending')));
}
async function initCloud(){
  const fallback=()=>{try{reportDocs=JSON.parse(localStorage.getItem('sbr_reports_v1')||'[]')}catch(e){reportDocs=[]}rebuildReported();};
  if(!window.claude||!window.claude.use){fallback();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);}catch(e){}
  cloud.user=user;
  const uid=user?await user.id():null;
  if(!db||!uid){fallback();return}
  cloud.db=db;cloud.uid=uid;cloud.teacher=await user.canEdit();
  try{const snap=await db.doc(`data/users/${uid}/save`).get();
    if(snap.exists&&!freshStart){const d=snap.data();if((d.total||0)>=S.total){S=Object.assign(newState(),JSON.parse(JSON.stringify(d)));migrate();if(!S.missions.length)S.missions=makeMissions();
      if(S.px&&!blocked(S.px,S.py)){player.x=S.px;player.y=S.py;}if(sheetKind==='title')renderSheet();}}
  }catch(e){}
  db.collection('reports').onSnapshot(q=>{reportDocs=q.docs.map(d=>({owner:d.id,items:Array.isArray(d.data().items)?d.data().items:[]}));rebuildReported();if(sheetKind==='report'||sheetKind==='dex')renderSheet();},e=>console.warn('reports',e));
  db.collection('scores').onSnapshot(q=>{scores=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(sheetKind==='rank')renderSheet();},e=>console.warn('scores',e));
  updateDots();
}

/* ================= 시작 ================= */
paintBase();buildSprites();
if(S.px){player.x=S.px;player.y=S.py;if(blocked(player.x,player.y)){player.x=24.5*T;player.y=14.5*T}}
resize();requestAnimationFrame(frame);
for(let i=0;i<6;i++)spawn();
updateDots();
openSheet('title');
// 자동 저장: 탐험 중에는 30초마다 위치·시간·기록을 저장
setInterval(()=>{if(sheetKind!=='title')saveNow()},30000);
$('#brand').style.cursor='pointer';$('#brand').title='처음 화면';$('#brand').onclick=()=>{if(mode==='map'){saveNow();openSheet('title');}};
initCloud();
</script>

</body></html>
