name: GitHub Pages 게임센터 배포
on:
  push:
    branches: [main]
    paths: ['site-catalog.json', 'github-pages-build.mjs', 'g/**', 'games/**', 'covers/**', 'audio/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: 게임 경로와 정적 사이트 검증
        run: node github-pages-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
